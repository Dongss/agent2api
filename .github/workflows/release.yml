# Publishes a release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tests run on all three released platforms first, and the release only
# happens if every one of them passes. That gating is the point: the runner
# supervises subprocesses differently on Windows than on unix, and a release
# that ships a Windows binary should have run the Windows tests.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Report every platform, not just the first to break: which ones fail is
      # the useful part when a failure is platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      # The race detector needs a C toolchain, which is dependable on Linux and
      # fiddly elsewhere; one platform running it is enough to catch a data race.
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      # Publishes the coverage number to a gist that shields.io renders as the
      # README badge. Two deliberate choices here:
      #
      #   - `gh api` rather than a badge action. This workflow can create
      #     releases, so every third-party action in it is a way to reach that
      #     permission; a PATCH of one gist is not worth the exposure.
      #   - Never fatal. A missing secret, a rate limit or a gist hiccup must
      #     not block a release, so the step exits 0 on anything unexpected and
      #     carries continue-on-error as a second line of defence. A stale
      #     badge is a much smaller problem than an unshippable tag.
      #
      # -coverpkg=./... measures the whole module, not each package against its
      # own tests: packages like internal/ir carry no test files of their own
      # but are exercised heavily by the frontends, and per-package counting
      # scores that as zero.
      - name: Publish the coverage badge
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: fb5b6041e3db32f9765ecaba9969e868
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "GIST_TOKEN is not set; skipping the coverage badge."
            exit 0
          fi
          go test -coverpkg=./... -coverprofile=coverage.out ./... >/dev/null
          pct=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${pct}%"
          whole=${pct%%.*}
          if   [ "$whole" -ge 85 ]; then color=brightgreen
          elif [ "$whole" -ge 70 ]; then color=green
          elif [ "$whole" -ge 55 ]; then color=yellowgreen
          elif [ "$whole" -ge 40 ]; then color=yellow
          else                           color=orange
          fi
          # The gist holds a shields.io endpoint document, so the badge JSON is
          # itself a string inside the PATCH body.
          badge=$(jq -nc --arg m "${pct}%" --arg c "$color" \
            '{schemaVersion: 1, label: "coverage", message: $m, color: $c}')
          jq -nc --arg b "$badge" \
            '{files: {"agent2api-coverage.json": {content: $b}}}' \
            | gh api "gists/${GIST_ID}" --method PATCH --input - >/dev/null
          echo "badge updated: ${pct}% (${color})"

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # GoReleaser creates the release and uploads assets to it.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the version and changelog from git history, which
          # a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
